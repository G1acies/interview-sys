server:
  port: 8080

spring:
  application:
    name: interview-learn

  # 虚拟线程
  threads:
    virtual:
      enabled: true

  # 数据源（PostgreSQL）
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:interview_learn}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # 文件上传
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

  # Spring AI — DashScope (OpenAI 兼容)
  ai:
    openai:
      api-key: ${AI_BAILIAN_API_KEY:***REMOVED***}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: ${AI_MODEL:qwen3.7-max}

# CORS 跨域
app:
  cors:
    allowed-origins: http://localhost:5173
  interview:
    follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT:1}
    evaluation-batch-size: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:8}
  resume:
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${APP_STORAGE_SECRET_KEY:minioadmin}
    bucket: ${APP_STORAGE_BUCKET:interview-guide}
    region: ${APP_STORAGE_REGION:us-east-1}

logging:
  level:
    interview.guide: DEBUG
